<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />

  <!-- Ícone padrão para o navegador -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />

  <!-- Ícone para a tela inicial do iOS (Recomendado usar PNG, não SVG) -->
  <link rel="apple-touch-icon" href="/icon-192x192.png" />

  <!-- Bloqueio rigoroso de zoom (Perfeito para o PDV) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

  <meta name="description" content="Village Cafe & Bar - Sistema de Gestão e PDV" />
  <meta name="theme-color" content="#4a3728" />

  <!-- VÍNCULO COM O ARQUIVO PWA -->
  <link rel="manifest" href="/manifest.json" />

  <!-- CONFIGURAÇÕES DE APP NATIVO PARA IOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Village Cafe" />

  <title>Village Cafe | PDV & Gestão</title>
</head>

<body class="bg-cafe-bg dark:bg-gray-900 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
